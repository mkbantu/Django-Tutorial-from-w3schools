<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>All Members</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="{% url 'main' %}">My Tennis Club</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'main' %}">Home</a>
                    <a class="nav-link active" aria-current="page" href="{% url 'members' %}">Members</a>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0">All Members</h1>
                <span class="badge text-bg-primary">{{ members|length }} members</span>
            </div>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">First name</th>
                                <th scope="col">Last name</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for member in members %}
                                <tr>
                                    <td>{{ member.first_name }}</td>
                                    <td>{{ member.last_name }}</td>
                                </tr>
                            {% empty %}
                                <tr>
                                    <td colspan="2" class="text-center text-muted py-4">No members have been added yet.</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </body>
</html>
